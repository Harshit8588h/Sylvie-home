name: sylvie
description: Private family safety app with live location, safe zones, and alerts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.3

  # Location + geofencing
  # geofence_service is discontinued; using its successor geofencing_api.
  geolocator: ^12.0.0
  geofencing_api: ^1.1.0
  permission_handler: ^11.3.1

  # Maps (OSM, free)
  flutter_map: ^7.0.1
  latlong2: ^0.9.1

  # Device + OEM awareness
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.2
  app_settings: ^5.1.1

  # Local storage + prefs
  shared_preferences: ^2.3.1

  # Notifications (local, for persistent service)
  flutter_local_notifications: ^17.2.2

  # Utilities
  url_launcher: ^6.3.0
  intl: ^0.19.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/   # re-enable when we add an actual asset
